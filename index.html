<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人生K线 · 人生每日收盘系统</title>
<style>
:root{
  --bg:#0A0B0D;
  --surface:#101216;
  --surface-2:#15171C;
  --line:rgba(255,255,255,.075);
  --line-strong:rgba(255,255,255,.14);
  --text:#EDEEF0;
  --dim:#9AA0A8;
  --faint:#63686F;
  --up:#F0555B;
  --up-soft:#FF8086;
  --down:#2FBF82;
  --down-soft:#5FDCA6;
  --gold:#C8A96A;
  --font-cn:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','HarmonyOS Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif;
  --font-num:'Bahnschrift','DIN Alternate','Oswald','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(900px 520px at 50% -8%, rgba(200,169,106,.055), transparent 70%),
    radial-gradient(700px 420px at 100% 100%, rgba(240,85,91,.04), transparent 70%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-cn);
  font-size:15px;
  line-height:1.6;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:560px;margin:0 auto;padding:28px 20px 72px}

/* ---------- header ---------- */
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:26px}
.brand h1{
  margin:0;font-size:26px;font-weight:300;letter-spacing:.2em;
  color:var(--text);
}
.brand p{margin:6px 0 0;font-size:11px;letter-spacing:.34em;color:var(--faint);font-weight:300}
.masthead .clock{font-family:var(--font-num);font-size:12px;letter-spacing:.16em;color:var(--faint);text-align:right;line-height:1.5}

/* ---------- section ---------- */
.section{margin-top:34px}
.sec-label{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sec-label span{font-size:11px;letter-spacing:.3em;color:var(--faint);white-space:nowrap}
.sec-label i{flex:1;height:1px;background:var(--line);display:block}

/* ---------- hero ---------- */
.hero{
  background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008));
  border:1px solid var(--line);
  border-radius:16px;
  padding:24px 22px 22px;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.dayline{display:flex;align-items:baseline;justify-content:center;gap:8px;font-family:var(--font-num)}
.dayline .n{font-size:34px;font-weight:400;letter-spacing:.02em;line-height:1}
.dayline .tot{font-size:15px;color:var(--faint);letter-spacing:.06em}
.dayline .cyc{font-size:11px;letter-spacing:.2em;color:var(--gold);margin-left:6px}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.07);margin:14px auto 8px;overflow:hidden;max-width:340px}
.bar > i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,rgba(200,169,106,.45),var(--gold));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.pct{font-family:var(--font-num);font-size:11px;letter-spacing:.18em;color:var(--faint)}

.score-box{margin:20px 0 4px;position:relative;display:inline-block;padding:0 10px}
.score-num{font-family:var(--font-num);font-weight:300;font-size:clamp(62px,16vw,96px);line-height:.95;letter-spacing:-.02em;display:inline-block;transition:color .35s}
.score-den{font-family:var(--font-num);font-size:14px;color:var(--faint);letter-spacing:.1em;margin-left:4px}
.score-num.is-up{color:var(--up)}
.score-num.is-down{color:var(--down)}
.score-num.pop{animation:pop .5s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{0%{transform:scale(.965);opacity:.55}60%{transform:scale(1.015)}100%{transform:scale(1);opacity:1}}

.pill{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--line-strong);border-radius:999px;
  padding:5px 14px;font-size:12px;letter-spacing:.16em;color:var(--dim);
  margin-top:12px;
}
.pill.up{color:var(--up-soft);border-color:rgba(240,85,91,.32);background:rgba(240,85,91,.07)}
.pill.down{color:var(--down-soft);border-color:rgba(47,191,130,.3);background:rgba(47,191,130,.06)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}

.streaks{margin-top:14px;font-family:var(--font-num);font-size:11.5px;letter-spacing:.12em;color:var(--faint);display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.streaks b{font-weight:400;color:var(--dim)}

/* ---------- alert ---------- */
.alert{
  margin-top:16px;border:1px solid rgba(200,169,106,.34);background:rgba(200,169,106,.075);
  border-radius:12px;padding:11px 14px;font-size:12.5px;color:#E4D2A6;letter-spacing:.06em;text-align:center;line-height:1.6;
}
.alert.soft{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.035);color:var(--dim)}
.alert b{font-family:var(--font-num);font-weight:400;color:var(--gold)}
.alert small{display:block;color:rgba(255,255,255,.4);font-size:11px;letter-spacing:.1em;margin-top:3px}

.makeup-bar{
  margin-top:14px;border:1px dashed rgba(200,169,106,.4);background:rgba(200,169,106,.06);
  border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--gold);
  display:flex;align-items:center;justify-content:space-between;gap:10px;letter-spacing:.08em;
}
.makeup-bar button{background:none;border:none;color:var(--text);font-size:12px;cursor:pointer;letter-spacing:.1em;opacity:.65;padding:0}
.makeup-bar button:hover{opacity:1}

/* ---------- checklist ---------- */
.list{background:rgba(255,255,255,.018);border:1px solid var(--line);border-radius:16px;padding:4px 18px}
.item{display:flex;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.mark{
  width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-strong);
  flex:none;display:flex;align-items:center;justify-content:center;
  font-size:11px;color:transparent;transition:.2s;
}
.item.done .mark{border-color:rgba(200,169,106,.55);background:rgba(200,169,106,.14);color:var(--gold)}
.item .name{flex:1;font-size:14.5px;color:var(--text);letter-spacing:.02em;transition:color .2s}
.item.done .name{color:var(--dim)}
.pts{font-family:var(--font-num);font-size:12px;color:var(--faint);letter-spacing:.06em;flex:none;width:34px;text-align:right}
.item.done .pts{color:rgba(200,169,106,.75)}
.act{display:flex;align-items:center;gap:4px;flex:none}
.btn-done{
  font-family:var(--font-cn);font-size:12.5px;letter-spacing:.18em;
  border:1px solid var(--line-strong);background:rgba(255,255,255,.03);color:var(--text);
  border-radius:8px;padding:7px 15px;cursor:pointer;transition:.18s;white-space:nowrap;
}
.btn-done:hover{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.3)}
.btn-done:active{transform:translateY(1px)}
.item.done .btn-done{
  background:rgba(200,169,106,.1);border-color:rgba(200,169,106,.3);color:var(--gold);cursor:default;
}
.item.done .btn-done:hover{background:rgba(200,169,106,.1);border-color:rgba(200,169,106,.3)}
.undo{
  background:none;border:none;color:var(--faint);cursor:pointer;font-size:12px;padding:4px 2px;opacity:0;transition:.18s;line-height:1
}
.item.done .undo{opacity:.45}
.item.done .undo:hover{opacity:1;color:var(--text)}
.today-foot{margin-top:14px;text-align:center;font-family:var(--font-num);font-size:13px;letter-spacing:.14em;color:var(--dim)}
.today-foot b{font-weight:400;font-size:16px;color:var(--text)}

/* ---------- kline ---------- */
.khead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ranges{display:flex;gap:6px}
.ranges button{
  font-family:var(--font-num);font-size:11px;letter-spacing:.08em;
  background:none;border:1px solid var(--line);color:var(--faint);
  border-radius:7px;padding:4px 9px;cursor:pointer;transition:.18s
}
.ranges button:hover{color:var(--dim);border-color:var(--line-strong)}
.ranges button.on{color:var(--text);border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.05)}
.kwrap{position:relative;height:clamp(230px,42vh,320px);border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,rgba(255,255,255,.02),rgba(255,255,255,.005));overflow:hidden}
#kline{display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--faint);letter-spacing:.1em}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
.legend .dash{display:inline-block;width:14px;height:0;border-top:1px dashed rgba(255,255,255,.4);margin-right:6px;vertical-align:middle}
.legend .ma{display:inline-block;width:14px;height:0;border-top:1.5px solid rgba(255,255,255,.4);margin-right:6px;vertical-align:middle}
.ktip{
  position:absolute;pointer-events:none;opacity:0;transition:opacity .12s;
  background:#191C21;border:1px solid rgba(255,255,255,.13);border-radius:9px;
  padding:8px 11px;font-size:12px;line-height:1.55;white-space:nowrap;transform:translate(-50%,-118%);
  box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:3;
}
.ktip .d{font-family:var(--font-num);letter-spacing:.08em;color:var(--faint);font-size:11px}
.ktip .s{font-family:var(--font-num);font-size:17px;letter-spacing:.02em}
.kempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12.5px;letter-spacing:.16em;text-align:center;padding:0 30px}

/* ---------- history ---------- */
.hist{background:rgba(255,255,255,.018);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.hrow{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:.16s}
.hrow:last-child{border-bottom:none}
.hrow:hover{background:rgba(255,255,255,.035)}
.hrow .hd{font-family:var(--font-num);font-size:13px;letter-spacing:.06em;color:var(--dim);width:56px;flex:none}
.hrow .hd2{font-size:11.5px;color:var(--faint);flex:1;font-family:var(--font-num);letter-spacing:.04em}
.hrow .hs{font-family:var(--font-num);font-size:17px;width:44px;text-align:right;flex:none}
.hrow .hs.up{color:var(--up)}
.hrow .hs.down{color:var(--down)}
.hrow .hb{width:22px;text-align:center;flex:none;font-size:12px}
.hdetail{padding:2px 18px 16px;background:rgba(0,0,0,.22);display:none}
.hdetail.open{display:block}
.hdetail .hdi{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:13px;color:var(--faint)}
.hdetail .hdi.on{color:var(--dim)}
.hdetail .hdi .m{width:15px;text-align:center;font-size:11px}
.hdetail .hmeta{margin-top:10px;font-size:11.5px;color:var(--faint);font-family:var(--font-num);letter-spacing:.08em;border-top:1px solid var(--line);padding-top:9px}
.empty-hist{padding:26px 18px;text-align:center;color:var(--faint);font-size:12.5px;letter-spacing:.14em}

/* ---------- 计划管理 ---------- */
.sec-label .add-plan{
  font-family:var(--font-cn);font-size:11px;letter-spacing:.16em;color:var(--faint);
  background:none;border:1px solid var(--line);border-radius:7px;padding:4px 11px;
  cursor:pointer;transition:.18s;white-space:nowrap;flex:none
}
.sec-label .add-plan:hover{color:var(--gold);border-color:rgba(200,169,106,.42);background:rgba(200,169,106,.06)}
.plan-list{max-height:274px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.plan-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.plan-row:last-child{border-bottom:none}
.plan-row.editing{background:rgba(200,169,106,.05)}
.plan-row .pn{flex:1;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-row .pp{font-family:var(--font-num);font-size:13px;color:var(--gold);width:40px;text-align:right;flex:none}
.icon-btn{background:none;border:none;color:var(--faint);font-size:13px;cursor:pointer;padding:3px 5px;line-height:1;transition:.16s;flex:none}
.icon-btn:hover{color:var(--text)}
.icon-btn.del:hover{color:var(--up-soft)}
.plan-row input[type=text],.plan-row input[type=number]{
  background:#0E1013;border:1px solid var(--line-strong);border-radius:7px;color:var(--text);
  padding:6px 8px;font-size:13px;outline:none;font-family:var(--font-cn);min-width:0
}
.plan-row input.n-in{flex:1}
.plan-row input.p-in{width:58px;font-family:var(--font-num);text-align:center}
.plan-row input:focus{border-color:rgba(200,169,106,.5)}
.plan-add{display:flex;gap:8px;align-items:center}
.plan-add input[type=text],.plan-add input[type=number]{
  background:#0E1013;border:1px solid var(--line-strong);border-radius:8px;color:var(--text);
  padding:9px 10px;font-size:13px;outline:none;font-family:var(--font-cn);min-width:0
}
.plan-add input.n-in{flex:1}
.plan-add input.p-in{width:70px;font-family:var(--font-num);text-align:center}
.plan-add button{
  font-family:var(--font-cn);font-size:12.5px;letter-spacing:.1em;color:var(--text);
  background:rgba(255,255,255,.08);border:1px solid var(--line-strong);border-radius:8px;
  padding:9px 14px;cursor:pointer;transition:.18s;white-space:nowrap
}
.plan-add button:hover{background:rgba(255,255,255,.14)}
.plan-foot{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.plan-foot .sum{font-family:var(--font-num);font-size:11.5px;letter-spacing:.08em;color:var(--faint)}
.plan-foot .sum b{font-weight:400;color:var(--gold);font-size:13px}
.plan-tip{margin-top:10px;font-size:11px;line-height:1.7;color:var(--faint);letter-spacing:.04em}

/* ---------- footer ---------- */
.foot{margin-top:38px;padding-top:18px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.foot .tools{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{
  font-family:var(--font-cn);font-size:11.5px;letter-spacing:.14em;color:var(--faint);
  background:none;border:1px solid var(--line);border-radius:7px;padding:5px 11px;cursor:pointer;transition:.18s
}
.tbtn:hover{color:var(--text);border-color:var(--line-strong)}
.foot .note{font-size:11px;color:var(--faint);letter-spacing:.1em}
input[type=date]{
  font-family:var(--font-num);background:#15171C;border:1px solid var(--line-strong);color:var(--text);
  border-radius:7px;padding:5px 8px;font-size:12px;letter-spacing:.06em;outline:none
}
.modal{
  position:fixed;inset:0;background:rgba(6,7,9,.72);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;z-index:20;padding:20px
}
.modal.open{display:flex}
.modal .card{background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;padding:22px;max-width:400px;width:100%;max-height:86vh;overflow-y:auto}
.modal h3{margin:0 0 6px;font-size:14px;font-weight:400;letter-spacing:.16em}
.modal p{margin:0 0 16px;font-size:12px;color:var(--faint);line-height:1.7;letter-spacing:.04em}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.modal .row button{font-family:var(--font-cn);font-size:12.5px;letter-spacing:.1em;border-radius:8px;padding:7px 14px;cursor:pointer;border:1px solid var(--line-strong);background:none;color:var(--dim)}
.modal .row button.pri{background:rgba(255,255,255,.92);color:#0A0B0D;border-color:transparent;font-weight:500}
.modal .card input[type=date]{width:100%;margin-top:6px}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);
  background:#191C21;border:1px solid var(--line-strong);border-radius:9px;padding:9px 16px;
  font-size:12.5px;letter-spacing:.1em;color:var(--text);opacity:0;transition:.25s;z-index:30;pointer-events:none
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:420px){
  .wrap{padding:22px 14px 60px}
  .item{gap:9px}
  .item .name{font-size:13.5px}
  .btn-done{padding:7px 12px;letter-spacing:.12em}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="brand">
      <h1>人生K线</h1>
      <p>人生每日收盘系统</p>
    </div>
    <div class="clock" id="clock"></div>
  </div>

  <!-- HERO -->
  <div class="hero">
    <div class="dayline">
      <span class="n" id="dayNo">1</span>
      <span class="tot">/ 100 天</span>
      <span class="cyc" id="cycleTag"></span>
    </div>
    <div class="bar"><i id="barFill" style="width:0%"></i></div>
    <div class="pct" id="pct">累计 1 天 · 完成 1%</div>

    <div class="score-box">
      <span class="score-num" id="scoreNum">0</span><span class="score-den" id="scoreDen">/ 100</span>
    </div>
    <div><span class="pill" id="statusPill"><i class="dot"></i><span>今日待打卡</span></span></div>

    <div class="streaks">
      <span>连续及格 <b id="sPass">0</b> 天</span>
      <span style="opacity:.35">·</span>
      <span>连续不及格 <b id="sFail">0</b> 天</span>
      <span style="opacity:.35">·</span>
      <span>已记录 <b id="sTotal">0</b> 天</span>
    </div>

    <div id="alertBox"></div>
    <div id="makeupBox"></div>
  </div>

  <!-- CHECKLIST -->
  <div class="section">
    <div class="sec-label"><span>今日打卡</span><i></i><button class="add-plan" id="btnPlan">+ 添加计划</button></div>
    <div class="list" id="list"></div>
    <div class="today-foot">今日：<b id="footScore">0</b> 分</div>
  </div>

  <!-- KLINE -->
  <div class="section">
    <div class="sec-label"><span>人生K线</span><i></i></div>
    <div class="khead">
      <div class="ranges" id="ranges">
        <button data-r="14">14天</button>
        <button data-r="30" class="on">30天</button>
        <button data-r="cycle">本周期</button>
        <button data-r="all">全部</button>
      </div>
    </div>
    <div class="kwrap" id="kwrap">
      <canvas id="kline"></canvas>
      <div class="ktip" id="ktip"></div>
      <div class="kempty" id="kempty" style="display:none"></div>
    </div>
    <div class="legend">
      <span><i style="background:#F0555B"></i>及格 ≥60</span>
      <span><i style="background:#2FBF82"></i>不及格 &lt;60</span>
      <span><span class="dash"></span>60分及格线</span>
      <span><span class="ma"></span>MA10 均线</span>
    </div>
  </div>

  <!-- HISTORY -->
  <div class="section">
    <div class="sec-label"><span>历史记录</span><i></i></div>
    <div class="hist" id="hist"></div>
  </div>

  <div class="foot">
    <div class="tools">
      <button class="tbtn" id="btnMakeup">补录</button>
      <button class="tbtn" id="btnStart">起始日</button>
      <button class="tbtn" id="btnExport">导出</button>
      <button class="tbtn" id="btnImport">导入</button>
    </div>
    <div class="note" id="footNote"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="card" id="modalCard"></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" style="display:none">

<script>
/* ================= 配置 ================= */
var PASS = 60;            // 及格线（固定，不随自定义项目变化）
var CYCLE = 100;          // 一个周期的天数
var KEY = 'life-kline-v1';
var MAX_ITEMS = 24;

/* 默认打卡计划（可自行增删改） */
function defaultItems(){
  return [
    {id:'d1', name:'07:30前起床',        pts:20},
    {id:'d2', name:'23:30前进房间上床',   pts:20},
    {id:'d3', name:'今日运动30分钟',      pts:20},
    {id:'d4', name:'沉浸式学习1小时以上',  pts:10},
    {id:'d5', name:'手机娱乐App <2小时',  pts:10},
    {id:'d6', name:'今日完成复盘',        pts:10},
    {id:'d7', name:'今日正确执行策略',     pts:10}
  ];
}

/* ================= 工具 ================= */
function $(s){return document.querySelector(s);}
function pad(n){return n<10?'0'+n:''+n;}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayKey(){return fmt(new Date());}
function parseD(s){return new Date(s+'T00:00:00');}
function diffDays(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
function addDays(s,n){var d=parseD(s);d.setDate(d.getDate()+n);return fmt(d);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function scoreOf(map){
  var s = 0;
  for(var i=0;i<state.items.length;i++){ if(map && map[state.items[i].id]) s += state.items[i].pts; }
  return s;
}
function totalScore(){
  var t = 0;
  for(var i=0;i<state.items.length;i++) t += state.items[i].pts;
  return t;
}
function dayNoOf(date){return diffDays(state.startDate, date)+1;}

/* ================= 状态 ================= */
var state = load();
var viewDate = todayKey();
var range = '30';        // 默认视图：30天跨度，从第1天起由左向右推进
var lastScore = -1;

function load(){
  var res = {startDate:todayKey(), items:defaultItems(), days:{}};
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw);
      if(o){
        res.startDate = o.startDate || todayKey();
        // 计划列表（带稳定 id，保证增删项目不影响历史记录）
        if(o.items && o.items.length){
          res.items = o.items.map(function(it, i){
            return {id: it.id || ('d'+(i+1)), name:String(it.name||''), pts:Number(it.pts)||0};
          });
        }
        if(o.days){
          for(var k in o.days){
            var rec = o.days[k] || {};
            var map = {};
            if(rec.items && !Array.isArray(rec.items)){
              map = rec.items;                      // 新格式：{id:true}
            }else if(Array.isArray(rec.items)){
              for(var i=0;i<rec.items.length;i++){  // 旧格式：[bool x7] → 按序映射到 id
                if(rec.items[i] && res.items[i]) map[res.items[i].id] = true;
              }
            }
            res.days[k] = {items:map, updatedAt:rec.updatedAt||0};
          }
        }
      }
    }
  }catch(e){}
  return res;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('保存失败：存储空间不足'); }
}
function recOf(date){
  if(!state.days[date]) state.days[date] = {items:{}, updatedAt:0};
  return state.days[date];
}

/* ================= 渲染 ================= */
function render(){
  renderHero();
  renderList();
  renderStreak();
  drawKLine();
  renderHistory();
  renderFootNote();
}

function renderHero(){
  var n = Math.max(1, dayNoOf(viewDate));
  var cycle = Math.floor((n-1)/CYCLE)+1;
  var inCycle = ((n-1)%CYCLE)+1;
  $('#dayNo').textContent = inCycle;
  $('#cycleTag').textContent = cycle>1 ? ('第 '+cycle+' 周期 · 累计 '+n+' 天') : '';
  var pctv = Math.round(inCycle/CYCLE*100);
  $('#barFill').style.width = pctv+'%';
  $('#pct').textContent = '累计 ' + n + ' 天 · 本周期完成 ' + pctv + '%';

  var rec = state.days[viewDate];
  var score = rec ? scoreOf(rec.items) : 0;
  var any = rec ? rec.items.some(function(x){return x;}) : false;

  var el = $('#scoreNum');
  var prevScore = lastScore;
  if(prevScore>=0 && prevScore!==score) animateNum(el, prevScore, score); else el.textContent = score;
  lastScore = score;
  el.classList.remove('is-up','is-down');
  if(score>=PASS) el.classList.add('is-up');
  else if(score>0) el.classList.add('is-down');
  // 刚跨过及格线时给一次轻微脉冲
  if(prevScore>=0 && prevScore<PASS && score>=PASS){ el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); }

  var pill = $('#statusPill');
  pill.className = 'pill';
  if(score>=PASS){ pill.classList.add('up'); pill.innerHTML = '<i class="dot"></i><span>今日及格</span>'; }
  else if(any){ pill.classList.add('down'); pill.innerHTML = '<i class="dot"></i><span>今日不及格</span>'; }
  else{ pill.innerHTML = '<i class="dot" style="background:var(--faint);box-shadow:none"></i><span>今日待打卡</span>'; }

  $('#scoreDen').textContent = '/ ' + totalScore();
  $('#footScore').textContent = score;

  // 补录提示条
  var mb = $('#makeupBox');
  if(viewDate !== todayKey()){
    mb.innerHTML = '<div class="makeup-bar"><span>补录模式 · '+viewDate+'（第 '+n+' 天）</span><button id="backToday">返回今日</button></div>';
    $('#backToday').onclick = function(){ viewDate = todayKey(); lastScore=-1; render(); };
  } else { mb.innerHTML = ''; }

  // 时钟
  var d = new Date();
  var wd = ['日','一','二','三','四','五','六'][d.getDay()];
  $('#clock').innerHTML = viewDate+'　周'+wd+'<br>'+pad(d.getHours())+':'+pad(d.getMinutes());
}

function animateNum(el, from, to){
  var t0 = performance.now(), dur = 380;
  function step(t){
    var p = Math.min(1,(t-t0)/dur);
    var e = 1-Math.pow(1-p,3);
    el.textContent = Math.round(from+(to-from)*e);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function renderList(){
  var rec = recOf(viewDate);
  var box = $('#list');
  box.innerHTML = '';
  state.items.forEach(function(it, i){
    var id = it.id;
    var done = !!rec.items[id];
    var row = document.createElement('div');
    row.className = 'item' + (done?' done':'');
    row.innerHTML =
      '<div class="mark">✓</div>' +
      '<div class="name">'+esc(it.name)+'</div>' +
      '<div class="pts">+'+it.pts+'</div>' +
      '<div class="act">' +
        '<button class="btn-done">'+(done?'✓ 已完成':'完成')+'</button>' +
        '<button class="undo" title="撤销">↺</button>' +
      '</div>';
    row.querySelector('.btn-done').onclick = function(){
      if(rec.items[id]) return;              // 不允许重复点击加分
      rec.items[id] = true;
      rec.updatedAt = Date.now();
      save(); render();
    };
    row.querySelector('.undo').onclick = function(){
      if(!rec.items[id]) return;
      rec.items[id] = false;
      rec.updatedAt = Date.now();
      save(); render();
    };
    box.appendChild(row);
  });
}

function allRecorded(){
  return Object.keys(state.days)
    .filter(function(k){ return state.days[k]; })
    .sort();
}

function renderStreak(){
  var keys = allRecorded();
  var scores = keys.map(function(k){ return scoreOf(state.days[k].items); });
  var pass=0, fail=0;
  if(scores.length){
    var last = scores[scores.length-1];
    if(last >= PASS){
      pass = 1;
      for(var i=scores.length-2;i>=0;i--){ if(scores[i]>=PASS) pass++; else break; }
    } else {
      fail = 1;
      for(var j=scores.length-2;j>=0;j--){ if(scores[j]<PASS) fail++; else break; }
    }
  }
  $('#sPass').textContent = pass;
  $('#sFail').textContent = fail;
  $('#sTotal').textContent = scores.length;

  var ab = $('#alertBox');
  if(fail >= 2){
    ab.innerHTML = '<div class="alert">⚠️ 已连续 '+fail+' 天低于 60 分'+
      '<small>仅作提醒 · 打卡不受影响，明天把它拉回 60 分上方即可</small></div>';
  } else if(fail === 1){
    ab.innerHTML = '<div class="alert soft">今日未及格 · 距离及格还差 <b>'+(PASS - scores[scores.length-1])+'</b> 分'+
      '<small>仅作提醒 · 明天记得回到 60 分上方</small></div>';
  } else { ab.innerHTML = ''; }
}

function renderFootNote(){
  $('#footNote').textContent = '起始日 '+state.startDate+' · '+state.items.length+' 项 / 满分 '+totalScore()+' 分 · 存于本机浏览器';
}

/* ================= K线 ================= */
function buildSeries(){
  var keys = allRecorded();
  var end = todayKey();
  if(keys.length && keys[keys.length-1] > end) end = keys[keys.length-1];
  var total = Math.max(1, diffDays(state.startDate, end)+1);
  var series = [];
  var prevScore = null;
  var recent = [];
  for(var i=0;i<total;i++){
    var date = addDays(state.startDate, i);
    var rec = state.days[date];
    var s = rec ? scoreOf(rec.items) : null;
    var ma = null;
    if(s !== null){
      recent.push(s);
      if(recent.length>10) recent.shift();
      var sum=0; for(var m=0;m<recent.length;m++) sum+=recent[m];
      ma = sum/recent.length;
    }
    series.push({day: i+1, date: date, score: s, open: (s===null ? null : (prevScore===null ? s : prevScore)), ma: ma});
    if(s !== null) prevScore = s;
  }
  return series;
}

var lastGeom = null;

function drawKLine(){
  var wrap = $('#kwrap'), cv = $('#kline');
  var W = wrap.clientWidth, H = wrap.clientHeight;
  if(W<=0||H<=0) return;
  var dpr = window.devicePixelRatio||1;
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  var g = cv.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,W,H);

  var all = buildSeries();
  var hasData = all.some(function(d){ return d.score!==null; });
  $('#kempty').style.display = hasData ? 'none' : 'flex';
  if(!hasData){
    $('#kempty').textContent = '完成今日打卡后，生成第一根人生K线';
    lastGeom = null;
    return;
  }

  // —— 视图：X 轴跨度固定，数据始终从第 1 格开始、由左向右推进 ——
  var totalDays = all.length;
  var view, span, startDayNo;
  if(range === 'cycle'){                                  // 本周期：100 格
    var cyc = Math.floor((Math.max(1,totalDays)-1)/CYCLE)+1;
    startDayNo = (cyc-1)*CYCLE+1; span = CYCLE;
    view = all.slice(startDayNo-1, startDayNo-1+span);
  } else if(range === 'all'){                             // 全部：至少 100 格
    startDayNo = 1; span = Math.max(CYCLE, totalDays); view = all;
  } else {                                                // 近 N 天：N 格
    var N = parseInt(range,10) || 30; span = N;
    startDayNo = Math.max(1, totalDays - N + 1);
    view = all.slice(startDayNo-1, startDayNo-1+N);
  }
  if(!view.length) return;

  var axisMax = Math.max(100, totalScore());
  var pl=38, pr=14, pt=18, pb=24;
  var plotW = W-pl-pr, plotH = H-pt-pb;
  var step = plotW/span;                        // 每天固定占一格宽度
  var bw = Math.max(1.6, Math.min(step*0.6, 22));
  var Y = function(s){ return pt + (axisMax-s)/axisMax*plotH; };
  var X = function(i){ return pl + (i+0.5)*step; };

  // 纵轴网格
  g.font = '11px system-ui, -apple-system, sans-serif';
  g.textBaseline = 'middle';
  var ticks = [];
  for(var t=0;t<=4;t++) ticks.push(Math.round(axisMax*t/4));
  if(ticks.indexOf(PASS)<0) ticks.push(PASS);
  ticks.sort(function(a,b){return a-b;});
  ticks.forEach(function(v){
    var y = Y(v);
    if(v===PASS){
      g.save();
      g.setLineDash([4,5]);
      g.strokeStyle = 'rgba(255,255,255,.24)';
      g.lineWidth = 1;
      g.beginPath(); g.moveTo(pl, y+.5); g.lineTo(W-pr, y+.5); g.stroke();
      g.restore();
      g.fillStyle = 'rgba(255,255,255,.55)';
      g.textAlign = 'left'; g.fillText(String(PASS), 6, y);
    } else {
      g.strokeStyle = 'rgba(255,255,255,.05)';
      g.lineWidth = 1;
      g.beginPath(); g.moveTo(pl, y+.5); g.lineTo(W-pr, y+.5); g.stroke();
      g.fillStyle = 'rgba(255,255,255,.22)';
      g.textAlign = 'left'; g.fillText(String(v), 6, y);
    }
  });

  // 底轴：已走过为实线，未到达为虚线（时间由左向右推进）
  var axisEnd = pl + Math.min(view.length, span)*step;
  g.strokeStyle = 'rgba(255,255,255,.1)';
  g.lineWidth = 1;
  g.beginPath(); g.moveTo(pl, H-pb+.5); g.lineTo(axisEnd, H-pb+.5); g.stroke();
  if(axisEnd < W-pr){
    g.save();
    g.setLineDash([3,6]);
    g.strokeStyle = 'rgba(255,255,255,.09)';
    g.beginPath(); g.moveTo(axisEnd, H-pb+.5); g.lineTo(W-pr, H-pb+.5); g.stroke();
    g.restore();
  }

  // 蜡烛
  view.forEach(function(d, i){
    if(d.score===null){
      g.fillStyle = 'rgba(255,255,255,.07)';
      g.fillRect(X(i)-0.5, H-pb-5, 1, 5);
      return;
    }
    var up = d.score >= PASS;
    var col = up ? '#F0555B' : '#2FBF82';
    var tick = up ? '#FF8A8F' : '#62DCA8';
    var o = d.open===null ? d.score : d.open;
    var y1 = Y(Math.max(o, d.score)), y2 = Y(Math.min(o, d.score));
    var h = Math.max(2.2, y2-y1);
    g.fillStyle = col;
    g.fillRect(X(i)-bw/2, y1, bw, h);
    // 收盘价横线
    g.fillStyle = tick;
    g.fillRect(X(i)-(bw+6)/2, Y(d.score)-1, bw+6, 2);
  });

  // MA10
  g.beginPath();
  var started = false;
  view.forEach(function(d, i){
    if(d.ma===null){ started = false; return; }
    var x = X(i), y = Y(d.ma);
    if(started) g.lineTo(x,y); else { g.moveTo(x,y); started = true; }
  });
  g.strokeStyle = 'rgba(255,255,255,.34)';
  g.lineWidth = 1.2;
  g.lineJoin = 'round';
  g.stroke();

  // X 轴标签：已到达的天用正常色，轴的理论终点用淡色
  g.textAlign = 'center';
  g.textBaseline = 'top';
  g.fillStyle = 'rgba(255,255,255,.28)';
  var every = Math.max(1, Math.ceil(view.length/8));
  view.forEach(function(d,i){
    if(i%every===0 || i===view.length-1){
      g.fillText('D'+d.day, X(i), H-pb+7);
    }
  });
  var endLabel = startDayNo + span - 1;
  if(endLabel > view[view.length-1].day){
    g.fillStyle = 'rgba(255,255,255,.14)';
    g.textAlign = 'right';
    g.fillText('D'+endLabel, W-pr, H-pb+7);
    g.textAlign = 'center';
  }

  lastGeom = {view:view, pl:pl, pr:pr, pt:pt, pb:pb, step:step, W:W, H:H, Y:Y, X:X, span:span, startDayNo:startDayNo};
}

function hoverKLine(clientX){
  if(!lastGeom) return;
  var wrap = $('#kwrap'), tip = $('#ktip');
  var rect = wrap.getBoundingClientRect();
  var x = clientX - rect.left;
  var gm = lastGeom;
  var i = Math.round((x - gm.pl)/gm.step - 0.5);
  if(i<0) i=0;
  if(i>=gm.view.length) i = gm.view.length-1;
  var d = gm.view[i];
  if(x < gm.pl-6 || x > gm.W-gm.pr+6){ tip.style.opacity = 0; return; }
  if(d.score===null){
    tip.style.opacity = 0;
    return;
  }
  var prev = null;
  for(var j=i-1;j>=0;j--){ if(gm.view[j].score!==null){ prev = gm.view[j].score; break; } }
  var delta = prev===null ? null : d.score-prev;
  var up = d.score>=PASS;
  tip.innerHTML =
    '<div class="d">第 '+d.day+' 天 · '+d.date+'</div>' +
    '<div class="s" style="color:'+(up?'#FF8086':'#5FDCA6')+'">'+d.score+
    ' <span style="font-size:12px;color:var(--faint)">'+(up?'🟢 及格':'🔴 不及格')+'</span></div>' +
    (delta===null?'':'<div class="d" style="margin-top:2px">较前次 '+(delta>=0?'+':'')+delta+'</div>');
  tip.style.left = gm.X(i)+'px';
  tip.style.top = (gm.Y(d.score)-6)+'px';
  tip.style.opacity = 1;
}

/* ================= 历史 ================= */
function renderHistory(){
  var keys = allRecorded().slice().reverse();
  var box = $('#hist');
  if(!keys.length){
    box.innerHTML = '<div class="empty-hist">暂无记录 · 点击上方「完成」开始第一天</div>';
    return;
  }
  box.innerHTML = '';
  keys.forEach(function(k){
    var rec = state.days[k];
    var s = scoreOf(rec.items);
    var up = s>=PASS;
    var n = dayNoOf(k);
    var row = document.createElement('div');
    row.className = 'hrow';
    row.innerHTML =
      '<div class="hd">Day '+n+'</div>' +
      '<div class="hd2">'+k+'</div>' +
      '<div class="hs '+(up?'up':'down')+'">'+s+'</div>' +
      '<div class="hb">'+(up?'🟢':'🔴')+'</div>';
    var det = document.createElement('div');
    det.className = 'hdetail';
    var html = '';
    state.items.forEach(function(it,i){
      var on = !!(rec.items && rec.items[it.id]);
      html += '<div class="hdi'+(on?' on':'')+'"><span class="m">'+(on?'✓':'○')+'</span>'+esc(it.name)+
              '<span style="margin-left:auto;font-family:var(--font-num);font-size:12px">'+(on?'+'+it.pts:'—')+'</span></div>';
    });
    // 与前一次记录对比
    var idx = allRecorded().indexOf(k);
    var cmp = '';
    if(idx>0){
      var pk = allRecorded()[idx-1];
      var ps = scoreOf(state.days[pk].items);
      var dd = s-ps;
      cmp = '较前次 '+(dd>=0?'+':'')+dd+' 分'+(dd>=0?' ▲':' ▼');
    } else { cmp = '首日记录'; }
    html += '<div class="hmeta">'+cmp+' · 得分 '+s+' / '+totalScore()+'</div>';
    det.innerHTML = html;
    row.onclick = function(){ det.classList.toggle('open'); };
    box.appendChild(row);
    box.appendChild(det);
  });
}

  range = b.getAttribute('data-r');

});

var kw = $('#kwrap');
kw.addEventListener('mousemove', function(e){ hoverKLine(e.clientX); });
kw.addEventListener('mouseleave', function(){ $('#ktip').style.opacity = 0; });
kw.addEventListener('touchstart', function(e){ hoverKLine(e.touches[0].clientX); }, {passive:true});

/* ================= 计划管理（自定义打卡项） ================= */
var planEditId = null;
var planSeq = 0;
function newId(){ planSeq++; return 'u' + Date.now().toString(36) + planSeq; }

$('#btnPlan').onclick = function(){ planEditId = null; renderPlanModal(); $('#modal').classList.add('open'); };

function renderPlanModal(){
  var card = $('#modalCard');
  var html = '<h3>打卡计划</h3><p>可增删改每日打卡项与分值。改动只影响计分方式，历史记录不会丢失。</p>';
  html += '<div class="plan-list">';
  state.items.forEach(function(it){
    if(planEditId === it.id){
      html += '<div class="plan-row editing">' +
                '<input type="text" class="n-in" maxlength="24" value="'+esc(it.name)+'" data-edname="'+it.id+'">' +
                '<input type="number" class="p-in" min="1" max="100" step="1" value="'+it.pts+'" data-edpts="'+it.id+'">' +
                '<button class="icon-btn" data-save="'+it.id+'">保存</button>' +
                '<button class="icon-btn" data-cancel="1">✕</button>' +
              '</div>';
    } else {
      html += '<div class="plan-row">' +
                '<div class="pn">'+esc(it.name)+'</div>' +
                '<div class="pp">+'+it.pts+'</div>' +
                '<button class="icon-btn" data-edit="'+it.id+'">✎</button>' +
                '<button class="icon-btn del" data-del="'+it.id+'">✕</button>' +
              '</div>';
    }
  });
  html += '</div>';
  html += '<div class="plan-add">' +
            '<input type="text" id="newName" class="n-in" placeholder="计划项目名称" maxlength="24">' +
            '<input type="number" id="newPts" class="p-in" placeholder="分值" min="1" max="100" step="1">' +
            '<button id="btnAddItem">添加</button>' +
          '</div>';
  html += '<div class="plan-foot">' +
            '<span class="sum">合计 <b>'+totalScore()+'</b> 分 · 及格线 '+PASS+' 分</span>' +
            '<span><button class="tbtn" id="btnResetPlan">恢复默认</button>' +
            '<button class="tbtn" id="btnClosePlan" style="color:var(--text);border-color:var(--line-strong)">完成</button></span>' +
          '</div>';
  html += '<div class="plan-tip">删除某项后，该项不再出现在每日打卡与历史计数中；其余记录照常保留。</div>';
  card.innerHTML = html;

  $('#modalCard').onclick = function(e){
    var b = e.target.closest('button');
    if(!b) return;
    if(b.dataset.edit){ planEditId = b.dataset.edit; renderPlanModal(); return; }
    if(b.dataset.cancel){ planEditId = null; renderPlanModal(); return; }
    if(b.dataset.save){
      var id = b.dataset.save;
      var ni = card.querySelector('[data-edname="'+id+'"]');
      var pi = card.querySelector('[data-edpts="'+id+'"]');
      applyItem(id, ni ? ni.value : '', pi ? pi.value : '');
      return;
    }
    if(b.dataset.del){
      if(state.items.length <= 1){ toast('至少保留一项'); return; }
      if(!confirm('删除「'+itemById(b.dataset.del).name+'」？历史记录中该项将不再计分。')) return;
      state.items = state.items.filter(function(x){ return x.id !== b.dataset.del; });
      save(); planEditId = null; renderPlanModal(); afterPlanChange();
      return;
    }
    if(b.id === 'btnAddItem'){
      applyItem(null, $('#newName').value, $('#newPts').value);
      return;
    }
    if(b.id === 'btnResetPlan'){
      if(!confirm('恢复为默认 7 项？自定义项目将被移除。')) return;
      state.items = defaultItems();
      save(); planEditId = null; renderPlanModal(); afterPlanChange();
      return;
    }
    if(b.id === 'btnClosePlan'){ closeModal(); render(); }
  };
  var nn = $('#newName');
  if(nn) nn.addEventListener('keydown', function(e){ if(e.key === 'Enter') $('#btnAddItem').click(); });
}

function itemById(id){
  for(var i=0;i<state.items.length;i++) if(state.items[i].id === id) return state.items[i];
  return {name:'', pts:0};
}
function applyItem(id, name, pts){
  name = String(name||'').trim();
  var p = parseInt(pts, 10);
  if(!name){ toast('请填写计划名称'); return; }
  if(isNaN(p) || p <= 0 || p > 100){ toast('分值请填 1-100 的整数'); return; }
  var target = id ? itemById(id) : null;
  if(target){
    target.name = name; target.pts = p;
  } else {
    if(state.items.length >= MAX_ITEMS){ toast('最多 '+MAX_ITEMS+' 项'); return; }
    state.items.push({id:newId(), name:name, pts:p});
  }
  save(); planEditId = null; renderPlanModal(); afterPlanChange();
}
function afterPlanChange(){
  lastScore = -1;
  render();
}

/* 补录 */
$('#btnMakeup').onclick = function(){
  openModal(
    '补录缺失的一天',
    '选择起始日之后、今天之前的某一天，补记当天的 7 项完成情况。',
    '<input type="date" id="mkDate" value="'+todayKey()+'" min="'+state.startDate+'" max="'+todayKey()+'">',
    function(){
      var v = $('#mkDate').value;
      if(!v){ toast('请选择日期'); return false; }
      if(v > todayKey()){ toast('不能补录未来'); return false; }
      viewDate = v; lastScore = -1;
      closeModal(); render();
      window.scrollTo({top:0, behavior:'smooth'});
      return true;
    }
  );
};

/* 起始日 */
$('#btnStart').onclick = function(){
  openModal(
    '设置起始日',
    '第 1 天从这一天开始计算。修改后所有历史记录的「第 N 天」会同步变化。',
    '<input type="date" id="stDate" value="'+state.startDate+'">',
    function(){
      var v = $('#stDate').value;
      if(!v){ toast('请选择日期'); return false; }
      state.startDate = v;
      save(); closeModal(); render();
      toast('起始日已更新');
      return true;
    }
  );
};

/* 导出 */
$('#btnExport').onclick = function(){
  var blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'life-kline-'+todayKey()+'.json';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  toast('已导出备份');
};

/* 导入 */
$('#btnImport').onclick = function(){ $('#fileIn').click(); };
$('#fileIn').onchange = function(e){
  var f = e.target.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var o = JSON.parse(r.result);
      if(!o || !o.days) throw new Error('格式不符');
      if(!confirm('导入将覆盖当前本机数据，确定继续？')) return;
      localStorage.setItem(KEY, JSON.stringify({startDate:o.startDate||todayKey(), days:o.days}));
      state = load();
      viewDate = todayKey(); lastScore = -1;
      render(); toast('导入完成');
    }catch(err){ toast('导入失败：文件格式不正确'); }
  };
  r.readAsText(f);
  e.target.value = '';
};

/* modal */
function openModal(title, desc, bodyHtml, onOk){
  var card = $('#modalCard');
  card.innerHTML =
    '<h3>'+title+'</h3><p>'+desc+'</p>'+bodyHtml+
    '<div class="row"><button id="mCancel">取消</button><button class="pri" id="mOk">确定</button></div>';
  $('#modal').classList.add('open');
  $('#mCancel').onclick = closeModal;
  $('#mOk').onclick = function(){ var ok = onOk(); if(ok!==false) closeModal(); };
}
function closeModal(){ $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click', function(e){ if(e.target === this) closeModal(); });

var toastTimer = null;
function toast(msg){
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

/* 跨午夜自动刷新 */
setInterval(function(){
  var t = todayKey();
  if(viewDate !== t && viewDate < t){
    viewDate = t; lastScore = -1; render();
  }
}, 30000);
document.addEventListener('visibilitychange', function(){
  if(!document.hidden){
    var t = todayKey();
    if(viewDate !== t && viewDate < t){ viewDate = t; lastScore = -1; }
    render();
  }
});

/* 启动 */
render();
</script>
</body>
</html>
